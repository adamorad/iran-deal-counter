<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>טראמפ מול איראן — מד ניסיונות ההסכם</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --border: #2a2a3a;
        --text: #e8e8f0;
        --muted: #7a7a9a;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #eab308;
        --blue: #3b82f6;
        --accent: #6366f1;
        --orange: #f97316;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html[lang="he"] body {
        font-family: "Heebo", sans-serif;
      }
      html[lang="en"] body {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── header ── */
      header {
        border-bottom: 1px solid var(--border);
        padding: 2.5rem 1rem 2rem;
        text-align: center;
        position: relative;
      }

      header h1 {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 800;
        margin-bottom: 0.5rem;
        letter-spacing: -0.01em;
      }

      header p {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 540px;
        margin: 0 auto;
        line-height: 1.6;
      }

      .lang-toggle {
        display: inline-block;
        margin-top: 1.4rem;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.35rem 1rem;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }
      .lang-toggle:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      /* ── stats ── */
      .stats {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        padding: 2rem 1rem;
        max-width: 900px;
        margin: 0 auto;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.4rem 2rem;
        text-align: center;
        min-width: 140px;
        flex: 1;
        max-width: 200px;
      }

      .stat-card .number {
        font-size: 2.8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 0.4rem;
      }

      .stat-card .label {
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.3;
      }

      html[lang="en"] .stat-card .label {
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-size: 0.72rem;
      }

      .stat-card.total .number {
        color: var(--accent);
      }
      .stat-card.deals .number {
        color: var(--green);
      }
      .stat-card.failed .number {
        color: var(--red);
      }
      .stat-card.ongoing .number {
        color: var(--yellow);
      }

      /* ── filters ── */
      .filters {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0 1rem 1.5rem;
      }

      .filter-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.4rem 0.9rem;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      /* ── timeline ── */
      .timeline {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 1rem 4rem;
        position: relative;
      }

      /* LTR: line on the left at date-width + padding */
      html[lang="en"] .timeline::before {
        content: "";
        position: absolute;
        left: calc(1rem + 112px);
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }

      /* RTL: line on the right at date-width + padding */
      html[lang="he"] .timeline::before {
        content: "";
        position: absolute;
        right: calc(1rem + 112px);
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }

      .event {
        display: flex;
        gap: 0;
        margin-bottom: 1.5rem;
        position: relative;
        transition: opacity 0.2s;
      }

      .event.hidden {
        display: none;
      }

      .event-date {
        flex-shrink: 0;
        width: 100px;
        padding-top: 0.85rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.3;
      }

      html[lang="en"] .event-date {
        text-align: right;
        padding-right: 1rem;
      }
      html[lang="he"] .event-date {
        text-align: left;
        padding-left: 1rem;
      }

      .dot-wrap {
        flex-shrink: 0;
        width: 26px;
        display: flex;
        justify-content: center;
        padding-top: 0.9rem;
        position: relative;
        z-index: 1;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--bg);
      }

      .dot.deal {
        background: var(--green);
      }
      .dot.failed {
        background: var(--red);
      }
      .dot.ongoing {
        background: var(--yellow);
      }
      .dot.partial {
        background: var(--blue);
      }
      .dot.strike {
        background: var(--orange);
      }

      /* ── card ── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.1rem 1.3rem;
        flex: 1;
      }

      .card:hover {
        border-color: #3a3a5a;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      html[lang="he"] .card-top {
        flex-direction: row-reverse;
      }

      .card-title {
        font-size: 0.97rem;
        font-weight: 700;
        line-height: 1.35;
      }

      .badge {
        font-size: 0.68rem;
        font-weight: 600;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      html[lang="en"] .badge {
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .badge.deal {
        background: #16532920;
        color: var(--green);
        border: 1px solid #16532940;
      }
      .badge.failed {
        background: #7f1d1d20;
        color: var(--red);
        border: 1px solid #7f1d1d40;
      }
      .badge.ongoing {
        background: #71350020;
        color: var(--yellow);
        border: 1px solid #71350040;
      }
      .badge.partial {
        background: #1e3a5f20;
        color: var(--blue);
        border: 1px solid #1e3a5f40;
      }
      .badge.strike {
        background: #43180520;
        color: var(--orange);
        border: 1px solid #43180540;
      }

      .card-desc {
        font-size: 0.87rem;
        color: #b0b0cc;
        line-height: 1.6;
      }

      .card-why {
        margin-top: 0.6rem;
        font-size: 0.8rem;
        color: var(--muted);
        font-style: italic;
        line-height: 1.5;
      }

      /* ── mobile ── */
      @media (max-width: 560px) {
        html[lang="en"] .timeline::before {
          left: calc(1rem + 13px);
        }
        html[lang="he"] .timeline::before {
          right: calc(1rem + 13px);
        }

        .event-date {
          display: none;
        }
        .dot-wrap {
          width: 28px;
        }

        .stat-card {
          min-width: 110px;
          padding: 1rem 1.2rem;
        }
        .stat-card .number {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>

      // ── state ─────────────────────────────────────────────────────
      let lang = "he";
      let activeFilter = "all";

      function setLang(l) {
        lang = l;
        const html = document.documentElement;
        html.lang = l;
        html.dir = l === "he" ? "rtl" : "ltr";
        document.title = T[l].title;
        document.getElementById("langBtn").textContent = T[l].langBtn;
        document.getElementById("hdr-title").textContent = T[l].title;
        document.getElementById("hdr-sub").textContent = T[l].sub;
        document.getElementById("lbl-total").textContent = T[l].stats.total;
        document.getElementById("lbl-deals").textContent = T[l].stats.deals;
        document.getElementById("lbl-failed").textContent = T[l].stats.failed;
        document.getElementById("lbl-ongoing").textContent = T[l].stats.ongoing;
        buildFilters();
        render(activeFilter);
      }

      function buildFilters() {
        const t = T[lang].filters;
        const container = document.getElementById("filters");
        container.innerHTML = "";
        Object.entries(t).forEach(([key, label]) => {
          const btn = document.createElement("button");
          btn.className =
            "filter-btn" + (key === activeFilter ? " active" : "");
          btn.dataset.filter = key;
          btn.textContent = label;
          btn.addEventListener("click", () => {
            activeFilter = key;
            buildFilters();
            render(key);
          });
          container.appendChild(btn);
        });
      }

      function render(filter) {
        const tl = document.getElementById("timeline");
        tl.innerHTML = "";
        const lbl = T[lang].labels;
        let total = 0,
          deals = 0,
          failed = 0,
          ongoing = 0;

        events.forEach((ev) => {
          if (ev.status !== "strike") total++;
          if (ev.status === "deal") deals++;
          else if (ev.status === "failed") failed++;
          else if (ev.status === "ongoing") ongoing++;

          const show = filter === "all" || filter === ev.status;
          const div = document.createElement("div");
          div.className = "event" + (show ? "" : " hidden");
          div.innerHTML = `
            <div class="event-date">${ev.year[lang]}</div>
            <div class="dot-wrap"><div class="dot ${ev.status}"></div></div>
            <div class="card">
              <div class="card-top">
                <div class="card-title">${ev.title[lang]}</div>
                <span class="badge ${ev.status}">${lbl[ev.status]}</span>
              </div>
              <div class="card-desc">${ev.desc[lang]}</div>
              <div class="card-why">${ev.why[lang]}</div>
            </div>`;
          tl.appendChild(div);
        });

        document.getElementById("cnt-total").textContent = total;
        document.getElementById("cnt-deals").textContent = deals;
        document.getElementById("cnt-failed").textContent = failed;
        document.getElementById("cnt-ongoing").textContent = ongoing;
      }

      document.getElementById("langBtn").addEventListener("click", () => {
        setLang(lang === "he" ? "en" : "he");
      });

      setLang("he");
    </script>
