<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>טראמפ מול איראן — מד ניסיונות ההסכם</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07070e;
        --text: #e8e8f0;
        --muted: #7a7a9a;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #eab308;
        --blue: #3b82f6;
        --accent: #6366f1;
        --orange: #f97316;
        --glass-bg: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-hover: rgba(255, 255, 255, 0.07);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html[lang="he"] body {
        font-family: "Heebo", sans-serif;
      }
      html[lang="en"] body {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        /* subtle background glow so glass has something to blur against */
        background-image:
          radial-gradient(
            ellipse 60% 40% at 20% 10%,
            rgba(99, 102, 241, 0.12) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 50% 35% at 80% 80%,
            rgba(239, 68, 68, 0.08) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 30% at 60% 40%,
            rgba(249, 115, 22, 0.06) 0%,
            transparent 70%
          );
      }

      /* ── header ── */
      header {
        border-bottom: 1px solid var(--glass-border);
        padding: 2.5rem 1rem 2rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(12px);
      }

      header h1 {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 800;
        margin-bottom: 0.5rem;
        letter-spacing: -0.01em;
      }

      header p {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 540px;
        margin: 0 auto;
        line-height: 1.6;
      }

      .lang-toggle {
        display: inline-block;
        margin-top: 1.1rem;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.35rem 1rem;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
        backdrop-filter: blur(8px);
      }
      .lang-toggle:hover {
        background: rgba(99, 102, 241, 0.25);
        border-color: rgba(99, 102, 241, 0.5);
        color: #fff;
      }

      /* ── stats ── */
      .stats {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 2rem 1rem;
        max-width: 900px;
        margin: 0 auto;
      }

      .stat-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 1.4rem 2rem;
        text-align: center;
        min-width: 130px;
        flex: 1;
        max-width: 200px;
        backdrop-filter: blur(16px);
        transition: background 0.2s;
      }
      .stat-card:hover {
        background: var(--glass-hover);
      }

      .stat-card .number {
        font-size: 2.8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 0.4rem;
      }

      .stat-card .label {
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.3;
      }
      html[lang="en"] .stat-card .label {
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-size: 0.7rem;
      }

      .stat-card.total .number {
        color: var(--accent);
      }
      .stat-card.deals .number {
        color: var(--green);
      }
      .stat-card.failed .number {
        color: var(--red);
      }
      .stat-card.ongoing .number {
        color: var(--yellow);
      }

      /* ── filters ── */
      .filters {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0 1rem 1.5rem;
      }

      .filter-btn {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        color: var(--muted);
        border-radius: 20px;
        padding: 0.38rem 1rem;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
        backdrop-filter: blur(8px);
      }
      .filter-btn:hover,
      .filter-btn.active {
        background: rgba(99, 102, 241, 0.2);
        border-color: rgba(99, 102, 241, 0.5);
        color: #c7c8ff;
      }

      /* ── trump counter ── */
      .trump-counter {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 1rem 2.5rem;
      }

      .trump-counter-header {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        margin-bottom: 1.2rem;
      }

      .trump-big-number {
        font-size: 4.5rem;
        font-weight: 800;
        line-height: 1;
        color: var(--accent);
        flex-shrink: 0;
      }

      .trump-counter-label strong {
        display: block;
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 0.25rem;
      }
      .trump-counter-label span {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .quote-list {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .quote-item {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 1rem 1.2rem;
        border-inline-start: 3px solid var(--accent);
        backdrop-filter: blur(16px);
        transition: background 0.2s;
      }
      .quote-item:hover {
        background: var(--glass-hover);
      }

      .quote-meta {
        font-size: 0.73rem;
        color: var(--muted);
        margin-bottom: 0.4rem;
        font-weight: 600;
      }
      .quote-text {
        font-size: 0.9rem;
        line-height: 1.55;
        color: var(--text);
        font-style: italic;
      }
      .quote-outcome {
        margin-top: 0.45rem;
        font-size: 0.78rem;
        color: rgba(239, 68, 68, 0.85);
      }

      /* ── iran counter ── */
      .iran-counter {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 1rem 2.5rem;
      }

      .iran-counter-header {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        margin-bottom: 1.2rem;
      }

      .iran-flag-icon {
        font-size: 2.8rem;
        line-height: 1;
        flex-shrink: 0;
      }

      .iran-counter .quote-item {
        border-inline-start-color: var(--red);
      }

      /* ── timeline ── */
      .timeline {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 1rem 4rem;
        position: relative;
      }

      html[lang="en"] .timeline::before {
        content: "";
        position: absolute;
        left: calc(1rem + 112px);
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--glass-border);
      }
      html[lang="he"] .timeline::before {
        content: "";
        position: absolute;
        right: calc(1rem + 112px);
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--glass-border);
      }

      .event {
        display: flex;
        gap: 0;
        margin-bottom: 1.2rem;
        position: relative;
      }
      .event.hidden {
        display: none;
      }

      .event-date {
        flex-shrink: 0;
        width: 100px;
        padding-top: 0.85rem;
        font-size: 0.73rem;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.3;
      }
      html[lang="en"] .event-date {
        text-align: right;
        padding-right: 1rem;
      }
      html[lang="he"] .event-date {
        text-align: left;
        padding-left: 1rem;
      }

      .dot-wrap {
        flex-shrink: 0;
        width: 26px;
        display: flex;
        justify-content: center;
        padding-top: 0.9rem;
        position: relative;
        z-index: 1;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid var(--bg);
        box-shadow: 0 0 6px currentColor;
      }
      .dot.deal {
        background: var(--green);
        color: var(--green);
      }
      .dot.failed {
        background: var(--red);
        color: var(--red);
      }
      .dot.ongoing {
        background: var(--yellow);
        color: var(--yellow);
      }
      .dot.partial {
        background: var(--blue);
        color: var(--blue);
      }
      .dot.strike {
        background: var(--orange);
        color: var(--orange);
      }

      /* ── card ── */
      .card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 1.1rem 1.3rem;
        flex: 1;
        backdrop-filter: blur(16px);
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .card:hover {
        background: var(--glass-hover);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      html[lang="he"] .card-top {
        flex-direction: row-reverse;
      }

      .card-title {
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.35;
      }

      .badge {
        font-size: 0.68rem;
        font-weight: 600;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        white-space: nowrap;
        flex-shrink: 0;
        backdrop-filter: blur(4px);
      }
      html[lang="en"] .badge {
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .badge.deal {
        background: rgba(22, 83, 41, 0.3);
        color: var(--green);
        border: 1px solid rgba(34, 197, 94, 0.25);
      }
      .badge.failed {
        background: rgba(127, 29, 29, 0.3);
        color: var(--red);
        border: 1px solid rgba(239, 68, 68, 0.25);
      }
      .badge.ongoing {
        background: rgba(113, 53, 0, 0.3);
        color: var(--yellow);
        border: 1px solid rgba(234, 179, 8, 0.25);
      }
      .badge.partial {
        background: rgba(30, 58, 95, 0.3);
        color: var(--blue);
        border: 1px solid rgba(59, 130, 246, 0.25);
      }
      .badge.strike {
        background: rgba(67, 24, 5, 0.3);
        color: var(--orange);
        border: 1px solid rgba(249, 115, 22, 0.25);
      }

      .card-desc {
        font-size: 0.87rem;
        color: rgba(232, 232, 240, 0.75);
        line-height: 1.6;
      }
      .card-why {
        margin-top: 0.6rem;
        font-size: 0.8rem;
        color: var(--muted);
        font-style: italic;
        line-height: 1.5;
      }

      /* ── mobile ── */
      @media (max-width: 560px) {
        html[lang="en"] .timeline::before {
          left: calc(1rem + 13px);
        }
        html[lang="he"] .timeline::before {
          right: calc(1rem + 13px);
        }
        .event-date {
          display: none;
        }
        .dot-wrap {
          width: 28px;
        }
        .stat-card {
          min-width: 110px;
          padding: 1rem 1.2rem;
        }
        .stat-card .number {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="hdr-title"></h1>
      <p id="hdr-sub"></p>
      <button class="lang-toggle" id="langBtn">EN</button>
    </header>

    <div class="stats">
      <div class="stat-card total">
        <div class="number" id="cnt-total">0</div>
        <div class="label" id="lbl-total"></div>
      </div>
      <div class="stat-card deals">
        <div class="number" id="cnt-deals">0</div>
        <div class="label" id="lbl-deals"></div>
      </div>
      <div class="stat-card failed">
        <div class="number" id="cnt-failed">0</div>
        <div class="label" id="lbl-failed"></div>
      </div>
      <div class="stat-card ongoing">
        <div class="number" id="cnt-ongoing">0</div>
        <div class="label" id="lbl-ongoing"></div>
      </div>
    </div>

    <div class="trump-counter">
      <div class="trump-counter-header">
        <div class="trump-big-number" id="trump-cnt">0</div>
        <div class="trump-counter-label">
          <strong id="trump-lbl-title"></strong>
          <span id="trump-lbl-sub"></span>
        </div>
      </div>
      <div class="quote-list" id="quote-list"></div>
    </div>

    <div class="iran-counter">
      <div class="iran-counter-header">
        <div class="iran-flag-icon">🇮🇷</div>
        <div class="trump-counter-label">

        </div>

      <div class="quote-list" id="iran-quote-list"></div>

      function renderTrumpCounter() {
        const t = T[lang];
        document.getElementById("trump-cnt").textContent = TRUMP_TOTAL + "+";
        document.getElementById("trump-lbl-title").textContent = t.trumpTitle;
        document.getElementById("trump-lbl-sub").textContent = t.trumpSub;

        const list = document.getElementById("quote-list");
        list.innerHTML = "";
        trumpQuotes.forEach((q) => {
          const div = document.createElement("div");
          div.className = "quote-item";
          div.innerHTML = `
            <div class="quote-meta">${q.date[lang]} &nbsp;·&nbsp; ${q.venue[lang]}</div>
            <div class="quote-text">${q.quote[lang]}</div>
            <div class="quote-outcome">↳ ${q.outcome[lang]}</div>`;
          list.appendChild(div);
        });
      }

      // ── state ─────────────────────────────────────────────────────
      let lang = "he";
      let activeFilter = "all";

      function setLang(l) {
        lang = l;
        const html = document.documentElement;
        html.lang = l;
        html.dir = l === "he" ? "rtl" : "ltr";
        document.title = T[l].title;
        document.getElementById("langBtn").textContent = T[l].langBtn;
        document.getElementById("hdr-title").textContent = T[l].title;
        document.getElementById("hdr-sub").textContent = T[l].sub;
        document.getElementById("lbl-total").textContent = T[l].stats.total;
        document.getElementById("lbl-deals").textContent = T[l].stats.deals;
        document.getElementById("lbl-failed").textContent = T[l].stats.failed;
        document.getElementById("lbl-ongoing").textContent = T[l].stats.ongoing;
        buildFilters();
        render(activeFilter);
        renderTrumpCounter();
        renderIranCounter();
      }

      function renderIranCounter() {
        const t = T[lang];
        document.getElementById("iran-lbl-title").textContent = t.iranTitle;
        document.getElementById("iran-lbl-sub").textContent = t.iranSub;

        const list = document.getElementById("iran-quote-list");
        list.innerHTML = "";
        iranQuotes.forEach((q) => {
          const div = document.createElement("div");
          div.className = "quote-item";
          div.innerHTML = `
            <div class="quote-meta">${q.date[lang]} &nbsp;·&nbsp; ${q.speaker[lang]}</div>
            <div class="quote-text">${q.quote[lang]}</div>
            <div class="quote-outcome">↳ ${q.outcome[lang]}</div>`;
          list.appendChild(div);
        });
      }

      function buildFilters() {
        const t = T[lang].filters;
        const container = document.getElementById("filters");
        container.innerHTML = "";
        Object.entries(t).forEach(([key, label]) => {
          const btn = document.createElement("button");
          btn.className =
            "filter-btn" + (key === activeFilter ? " active" : "");
          btn.dataset.filter = key;
          btn.textContent = label;
          btn.addEventListener("click", () => {
            activeFilter = key;
            buildFilters();
            render(key);
          });
          container.appendChild(btn);
        });
      }

      function render(filter) {
        const tl = document.getElementById("timeline");
        tl.innerHTML = "";
        const lbl = T[lang].labels;
        let total = 0,
          deals = 0,
          failed = 0,
          ongoing = 0;

        events.forEach((ev) => {
          if (ev.status !== "strike") total++;
          if (ev.status === "deal") deals++;
          else if (ev.status === "failed") failed++;
          else if (ev.status === "ongoing") ongoing++;

          const show = filter === "all" || filter === ev.status;
          const div = document.createElement("div");
          div.className = "event" + (show ? "" : " hidden");
          div.innerHTML = `
            <div class="event-date">${ev.year[lang]}</div>
            <div class="dot-wrap"><div class="dot ${ev.status}"></div></div>
            <div class="card">
              <div class="card-top">
                <div class="card-title">${ev.title[lang]}</div>
                <span class="badge ${ev.status}">${lbl[ev.status]}</span>
              </div>
              <div class="card-desc">${ev.desc[lang]}</div>
              <div class="card-why">${ev.why[lang]}</div>
            </div>`;
          tl.appendChild(div);
        });

        document.getElementById("cnt-total").textContent = total;
        document.getElementById("cnt-deals").textContent = deals;
        document.getElementById("cnt-failed").textContent = failed;
        document.getElementById("cnt-ongoing").textContent = ongoing;
      }

      document.getElementById("langBtn").addEventListener("click", () => {
        setLang(lang === "he" ? "en" : "he");
      });

      setLang("he");
    </script>
  </body>
</html>
