<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trump vs Iran: Deal Counter</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --border: #2a2a3a;
        --text: #e8e8f0;
        --muted: #7a7a9a;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #eab308;
        --blue: #3b82f6;
        --accent: #6366f1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
      }

      header {
        border-bottom: 1px solid var(--border);
        padding: 2.5rem 1rem 2rem;
        text-align: center;
      }

      header h1 {
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }

      header p {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 520px;
        margin: 0 auto;
        line-height: 1.5;
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        padding: 2rem 1rem;
        max-width: 900px;
        margin: 0 auto;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.4rem 2rem;
        text-align: center;
        min-width: 140px;
        flex: 1;
        max-width: 200px;
      }

      .stat-card .number {
        font-size: 2.8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 0.4rem;
      }

      .stat-card .label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .stat-card.total .number {
        color: var(--accent);
      }
      .stat-card.deals .number {
        color: var(--green);
      }
      .stat-card.failed .number {
        color: var(--red);
      }
      .stat-card.ongoing .number {
        color: var(--yellow);
      }

      .filters {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0 1rem 1.5rem;
      }

      .filter-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.4rem 0.9rem;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.15s;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .timeline {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 1rem 4rem;
        position: relative;
      }

      .timeline::before {
        content: "";
        position: absolute;
        left: calc(1rem + 112px);
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }

      .event {
        display: flex;
        gap: 0;
        margin-bottom: 1.5rem;
        position: relative;
        transition: opacity 0.2s;
      }

      .event.hidden {
        display: none;
      }

      .event-date {
        flex-shrink: 0;
        width: 100px;
        text-align: right;
        padding-right: 1rem;
        padding-top: 0.85rem;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.3;
      }

      .dot-wrap {
        flex-shrink: 0;
        width: 26px;
        display: flex;
        justify-content: center;
        padding-top: 0.9rem;
        position: relative;
        z-index: 1;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--bg);
      }

      .dot.deal {
        background: var(--green);
      }
      .dot.failed {
        background: var(--red);
      }
      .dot.ongoing {
        background: var(--yellow);
      }
      .dot.partial {
        background: var(--blue);
      }
      .dot.strike {
        background: #f97316;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.1rem 1.3rem;
        flex: 1;
      }

      .card:hover {
        border-color: #3a3a5a;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .card-title {
        font-size: 0.97rem;
        font-weight: 600;
        line-height: 1.3;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .badge.deal {
        background: #16532920;
        color: var(--green);
        border: 1px solid #16532940;
      }
      .badge.failed {
        background: #7f1d1d20;
        color: var(--red);
        border: 1px solid #7f1d1d40;
      }
      .badge.ongoing {
        background: #71350020;
        color: var(--yellow);
        border: 1px solid #71350040;
      }
      .badge.partial {
        background: #1e3a5f20;
        color: var(--blue);
        border: 1px solid #1e3a5f40;
      }
      .badge.strike {
        background: #43180520;
        color: #f97316;
        border: 1px solid #43180540;
      }

      .card-desc {
        font-size: 0.855rem;
        color: #b0b0cc;
        line-height: 1.55;
      }

      .card-why {
        margin-top: 0.6rem;
        font-size: 0.8rem;
        color: var(--muted);
        font-style: italic;
      }

      @media (max-width: 560px) {
        .timeline::before {
          left: calc(1rem + 13px);
        }
        .event-date {
          display: none;
        }
        .dot-wrap {
          width: 28px;
        }
        .card-title::before {
          content: attr(data-date) " · ";
          color: var(--muted);
          font-weight: 400;
          font-size: 0.75rem;
        }
        .stat-card {
          min-width: 110px;
          padding: 1rem 1.2rem;
        }
        .stat-card .number {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Trump vs Iran &nbsp; Deal Counter</h1>
      <p>
        Every time the US and Iran were close to a deal during the
        2025&ndash;2026 conflict — and what broke it each time.
      </p>
    </header>

    <div class="stats">
      <div class="stat-card total">
        <div class="number" id="cnt-total">0</div>
        <div class="label">Close Calls</div>
      </div>
      <div class="stat-card deals">
        <div class="number" id="cnt-deals">0</div>
        <div class="label">Deals Signed</div>
      </div>
      <div class="stat-card failed">
        <div class="number" id="cnt-failed">0</div>
        <div class="label">Fell Through</div>
      </div>
      <div class="stat-card ongoing">
        <div class="number" id="cnt-ongoing">0</div>
        <div class="label">Ongoing / Open</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="failed">Fell Through</button>
      <button class="filter-btn" data-filter="strike">Assassinations</button>
      <button class="filter-btn" data-filter="ongoing">Ongoing</button>
    </div>

    <div class="timeline" id="timeline"></div>

    <script>
      const events = [
        {
          year: "Jul–Oct 2024",
          title: "Haniyeh, Nasrallah & Sinwar Assassinated",
          status: "strike",
          desc: "Israel killed Hamas political chief Ismail Haniyeh in Tehran (Jul 31), Hezbollah leader Hassan Nasrallah in Beirut (Sep 27), and Hamas commander Yahya Sinwar in Gaza (Oct 16) — dismantling Iran's 'axis of resistance' proxy network before Trump returned to office.",
          why: "Iran's deterrence posture collapsed. Entering 2025 with no functional proxies and no nuclear deal, Tehran faced Trump's second term at its weakest strategic position in decades.",
        },
        {
          year: "Jan–Feb 2025",
          title: "Trump's Letter & 60-Day Ultimatum",
          status: "failed",
          desc: "Trump took office, relaunched 'maximum pressure' sanctions, and sent a personal letter to Supreme Leader Khamenei via Oman. He gave Iran a 60-day deadline to begin negotiations — or face military action.",
          why: "Khamenei rejected direct talks publicly. Iran's position: it would not negotiate 'under a gun.' The clock started ticking around April 12–13 when talks opened.",
        },
        {
          year: "Apr 12–13, 2025",
          title: "Round 1 — Muscat (Omani-Mediated)",
          status: "failed",
          desc: "First round of Omani-mediated nuclear talks in Muscat. Trump's 60-day deadline clock started here. Envoy Steve Witkoff led for the US; Iran sent senior nuclear negotiators. IAEA had just reported Iran held 408.6 kg of 60%-enriched uranium — well above the 3.67% JCPOA limit.",
          why: "No agreement. Iran cited US 'contradictory behaviour' as a reason for the slow pace.",
        },
        {
          year: "Apr 14–15, 2025",
          title: "Witkoff Reversal: 3.67% → 'Complete Dismantlement'",
          status: "failed",
          desc: "On April 14, Witkoff told Fox News the US would accept Iran reducing enrichment to 3.67% with intrusive monitoring. The next day, he posted on X that Iran must 'stop and eliminate its nuclear enrichment and weaponization program' entirely — a complete reversal within 24 hours.",
          why: "The contradiction undermined Iran's ability to evaluate any US proposal. Iran cited it as evidence the US wasn't negotiating in good faith.",
        },
        {
          year: "Apr 26, 2025",
          title: "Round 2 — Muscat, Technical-Level Discussions",
          status: "failed",
          desc: "Third round of talks in Oman (including technical experts on both sides). Discussions went into the details of centrifuge counts and enrichment levels. A fourth round was scheduled for May 3.",
          why: "Round postponed by Oman citing logistics; Iran cited US 'contradictory behaviour.' Rescheduled to May 11.",
        },
        {
          year: "May 4, 2025",
          title: "Trump: 'Total Dismantlement. That Is All I Would Accept.'",
          status: "failed",
          desc: "On Meet the Press, Trump declared: 'Total dismantlement. Yes, that is all I would accept.' VP Vance contradicted him three days later at the Munich Leaders Meeting, suggesting limited enrichment below weapons-grade might be acceptable. A leaked 14-point US memo simultaneously called for a mere 'moratorium' on enrichment.",
          why: "Three irreconcilable US positions existed simultaneously. Iran's FM Araghchi said negotiating was 'impossible' with such contradictions.",
        },
        {
          year: "May 11, 2025",
          title: "Round 3 — Muscat",
          status: "failed",
          desc: "Talks resumed in Muscat — the fourth round of the Omani channel (third substantive session). Both sides described the atmosphere as 'serious' but no framework emerged. Iran was still enriching at 60%; the US was still demanding dismantlement.",
          why: "Talks continued without agreement. The 60-day deadline was now six weeks away.",
        },
        {
          year: "Jun 12, 2025",
          title: "Deadline Day — Trump: 'Today Is Day 61'",
          status: "failed",
          desc: "Trump told CNN: 'I gave them 60 days, and today is day 61.' No deal had been reached. No further talks were scheduled. Israel had been requesting US coordination for a strike for weeks.",
          why: "The deadline expired with zero agreement. Israel launched strikes the following morning.",
        },
        {
          year: "Jun 13, 2025",
          title: "Israel Launches the Twelve-Day War",
          status: "strike",
          desc: "~200 Israeli fighter jets struck 100+ targets across Iran in the opening salvo of what became the Twelve-Day War. Killed: IRGC commander Hossein Salami, armed forces chief of staff Mohammad Bagheri, and IRGC air force commander Hajizadeh. The Natanz Pilot Fuel Enrichment Plant was destroyed. Nuclear scientists, missile sites, and IRGC bases were also hit.",
          why: "Iran launched retaliatory missile and drone barrages at Israel. The diplomatic track was suspended entirely.",
        },
        {
          year: "Jun 21–22, 2025",
          title: "Operation Midnight Hammer — US B-2 Strikes",
          status: "strike",
          desc: "Seven B-2 Spirit stealth bombers from the 509th Bomb Wing dropped 12–14 GBU-57A/B bunker-buster bombs on Fordow (underground), Natanz, and Isfahan nuclear sites. Trump called it 'a limited, one-off mission.' Iran had reportedly moved enriched uranium stockpiles before the strikes.",
          why: "A DIA battle damage assessment (labeled 'low confidence, preliminary') concluded the strikes set back Iran's nuclear weapons capability by only 'a matter of months, not years.' Iran's underground Fordow facility was not fully destroyed.",
        },
        {
          year: "Feb 26, 2026",
          title: "Final Round — Geneva, Iran's Last Offer",
          status: "failed",
          desc: "The final round of Omani-mediated talks, held in Geneva. Iran put its most detailed proposal on the table: enrich up to 20% U-235 using 30 cascades of advanced IR-6 centrifuges, justified by a 10-year reactor fuel plan; would not accumulate enriched gas; and offered to blend down its 60% stockpile. The US did not accept.",
          why: "Strikes began 48 hours later. According to ACA analysis, US negotiators arrived 'ill-prepared for serious nuclear talks.'",
        },
        {
          year: "Feb 28, 2026",
          title:
            "Operation Epic Fury + Operation Roaring Lion — Khamenei Killed",
          status: "strike",
          desc: "The US (Operation Epic Fury) and Israel (Operation Roaring Lion) launched a combined strike campaign — approximately 900 US strikes in the first 12 hours. Killed: Supreme Leader Ayatollah Ali Khamenei, IRGC commander Mohammad Pakpour, and Defense Minister Aziz Nasirzadeh. Numerous sites in Tehran and across Iran were bombed.",
          why: "Iran retaliated with missiles and drones against Israel and 16 US military bases across Bahrain, Kuwait, Qatar, the UAE, and Saudi Arabia. On March 2, Iran struck Aramco's Ras Tanura refinery and Qatar's Ras Laffan LNG complex.",
        },
        {
          year: "Apr 11–12, 2026",
          title: "Islamabad Talks — Pakistan-Brokered, Failed",
          status: "failed",
          desc: "Pakistan brokered a final round of US-Iran talks in Islamabad. Both sides attended. Talks ended without agreement. Trump announced immediately after: he 'no longer cared about negotiations.'",
          why: "Trump announced a naval blockade of Iran effective April 13, 2026 at 10 a.m. ET — the first US naval blockade since the Cuban Missile Crisis.",
        },
        {
          year: "Apr 13, 2026",
          title: "US Naval Blockade of Iran — Ongoing",
          status: "ongoing",
          desc: "The US Navy enforced a full blockade of Iranian ports and the Strait of Hormuz approaches. Iran's oil exports halted. The IAEA has been unable to conduct inspections of Iranian nuclear sites since the June 2025 war. Iran's post-strike nuclear program status remains unknown.",
          why: "Status as of June 2026: blockade in effect. No diplomatic channel active. Iran's government and IRGC command structure in transition following Khamenei's killing.",
        },
      ];

      function render(filter) {
        const tl = document.getElementById("timeline");
        tl.innerHTML = "";

        let total = 0,
          deals = 0,
          failed = 0,
          ongoing = 0;

        events.forEach((ev) => {
          if (ev.status !== "strike") total++;
          if (ev.status === "deal") deals++;
          else if (ev.status === "failed") failed++;
          else if (ev.status === "ongoing") ongoing++;

          const show = filter === "all" || filter === ev.status;

          const labels = {
            deal: "Deal Reached",
            failed: "Fell Through",
            partial: "Partial",
            ongoing: "Ongoing",
            strike: "Assassination / Strike",
          };

          const div = document.createElement("div");
          div.className = "event" + (show ? "" : " hidden");
          div.innerHTML = `
      <div class="event-date">${ev.year}</div>
      <div class="dot-wrap"><div class="dot ${ev.status}"></div></div>
      <div class="card">
        <div class="card-top">
          <div class="card-title" data-date="${ev.year}">${ev.title}</div>
          <span class="badge ${ev.status}">${labels[ev.status]}</span>
        </div>
        <div class="card-desc">${ev.desc}</div>
        <div class="card-why">${ev.why}</div>
      </div>
    `;
          tl.appendChild(div);
        });

        document.getElementById("cnt-total").textContent = total;
        document.getElementById("cnt-deals").textContent = deals;
        document.getElementById("cnt-failed").textContent = failed;
        document.getElementById("cnt-ongoing").textContent = ongoing;
      }

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          render(btn.dataset.filter);
        });
      });

      render("all");
    </script>
  </body>
</html>
