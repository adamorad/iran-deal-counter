<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trump vs Iran: Deal Counter</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --border: #2a2a3a;
        --text: #e8e8f0;
        --muted: #7a7a9a;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #eab308;
        --blue: #3b82f6;
        --accent: #6366f1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
      }

      header {
        border-bottom: 1px solid var(--border);
        padding: 2.5rem 1rem 2rem;
        text-align: center;
      }

      header h1 {
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }

      header p {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 520px;
        margin: 0 auto;
        line-height: 1.5;
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        padding: 2rem 1rem;
        max-width: 900px;
        margin: 0 auto;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.4rem 2rem;
        text-align: center;
        min-width: 140px;
        flex: 1;
        max-width: 200px;
      }

      .stat-card .number {
        font-size: 2.8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 0.4rem;
      }

      .stat-card .label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .stat-card.total .number {
        color: var(--accent);
      }
      .stat-card.deals .number {
        color: var(--green);
      }
      .stat-card.failed .number {
        color: var(--red);
      }
      .stat-card.ongoing .number {
        color: var(--yellow);
      }

      .filters {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0 1rem 1.5rem;
      }

      .filter-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.4rem 0.9rem;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.15s;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .timeline {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 1rem 4rem;
        position: relative;
      }

      .timeline::before {
        content: "";
        position: absolute;
        left: calc(1rem + 112px);
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }

      .event {
        display: flex;
        gap: 0;
        margin-bottom: 1.5rem;
        position: relative;
        transition: opacity 0.2s;
      }

      .event.hidden {
        display: none;
      }

      .event-date {
        flex-shrink: 0;
        width: 100px;
        text-align: right;
        padding-right: 1rem;
        padding-top: 0.85rem;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.3;
      }

      .dot-wrap {
        flex-shrink: 0;
        width: 26px;
        display: flex;
        justify-content: center;
        padding-top: 0.9rem;
        position: relative;
        z-index: 1;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--bg);
      }

      .dot.deal {
        background: var(--green);
      }
      .dot.failed {
        background: var(--red);
      }
      .dot.ongoing {
        background: var(--yellow);
      }
      .dot.partial {
        background: var(--blue);
      }
      .dot.strike {
        background: #f97316;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.1rem 1.3rem;
        flex: 1;
      }

      .card:hover {
        border-color: #3a3a5a;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .card-title {
        font-size: 0.97rem;
        font-weight: 600;
        line-height: 1.3;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .badge.deal {
        background: #16532920;
        color: var(--green);
        border: 1px solid #16532940;
      }
      .badge.failed {
        background: #7f1d1d20;
        color: var(--red);
        border: 1px solid #7f1d1d40;
      }
      .badge.ongoing {
        background: #71350020;
        color: var(--yellow);
        border: 1px solid #71350040;
      }
      .badge.partial {
        background: #1e3a5f20;
        color: var(--blue);
        border: 1px solid #1e3a5f40;
      }
      .badge.strike {
        background: #43180520;
        color: #f97316;
        border: 1px solid #43180540;
      }

      .card-desc {
        font-size: 0.855rem;
        color: #b0b0cc;
        line-height: 1.55;
      }

      .card-why {
        margin-top: 0.6rem;
        font-size: 0.8rem;
        color: var(--muted);
        font-style: italic;
      }

      @media (max-width: 560px) {
        .timeline::before {
          left: calc(1rem + 13px);
        }
        .event-date {
          display: none;
        }
        .dot-wrap {
          width: 28px;
        }
        .card-title::before {
          content: attr(data-date) " · ";
          color: var(--muted);
          font-weight: 400;
          font-size: 0.75rem;
        }
        .stat-card {
          min-width: 110px;
          padding: 1rem 1.2rem;
        }
        .stat-card .number {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Trump vs Iran &nbsp; Deal Counter</h1>
      <p>
        Every time the US and Iran were close to a deal during the
        2025&ndash;2026 conflict — and what broke it each time.
      </p>
    </header>

    <div class="stats">
      <div class="stat-card total">
        <div class="number" id="cnt-total">0</div>
        <div class="label">Close Calls</div>
      </div>
      <div class="stat-card deals">
        <div class="number" id="cnt-deals">0</div>
        <div class="label">Deals Signed</div>
      </div>
      <div class="stat-card failed">
        <div class="number" id="cnt-failed">0</div>
        <div class="label">Fell Through</div>
      </div>
      <div class="stat-card ongoing">
        <div class="number" id="cnt-ongoing">0</div>
        <div class="label">Ongoing / Open</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="failed">Fell Through</button>
      <button class="filter-btn" data-filter="strike">Assassinations</button>
      <button class="filter-btn" data-filter="ongoing">Ongoing</button>
    </div>

    <div class="timeline" id="timeline"></div>

    <script>
      const events = [
        {
          year: "Jul–Oct 2024",
          title: "Haniyeh, Nasrallah, Sinwar Killed — Prelude to 2025",
          status: "strike",
          desc: "Israel assassinated Hamas political chief Ismail Haniyeh in Tehran (July 31), Hezbollah Secretary-General Hassan Nasrallah in Beirut (September 27), and Hamas military commander Yahya Sinwar in Gaza (October 16). All were central to Iran's 'axis of resistance' strategy.",
          why: "The decapitation of Iran's two most powerful proxies dramatically weakened its deterrence posture heading into Trump's second term, reshaping the balance of pressure entering 2025 negotiations.",
        },
        {
          year: "Jan–Feb 2025",
          title: "Maximum Pressure 2.0 + Trump's Letter to Khamenei",
          status: "failed",
          desc: "Trump returned to office and immediately relaunched 'maximum pressure' sanctions. He sent a personal letter to Supreme Leader Khamenei via Oman offering direct negotiations — giving Iran a 2-month deadline to respond or face military action.",
          why: "Khamenei rejected direct talks publicly, saying Iran would not negotiate 'under a gun.' No meeting materialized.",
        },
        {
          year: "Jan 2025",
          title: "Assassination of Mohammed Reza Zahedi's Successor",
          status: "strike",
          desc: "Israel killed a senior IRGC Quds Force commander in Syria in a strike on a Damascus-area facility — continuing its campaign against Iran's forward-deployed military leadership following the April 2024 killing of Zahedi.",
          why: "Iran vowed retaliation but did not immediately escalate, absorbing the strike as part of the broader shadow war.",
        },
        {
          year: "March 2025",
          title: "Round 1 — Muscat Indirect Talks",
          status: "failed",
          desc: "Envoy Steve Witkoff met with Iranian officials in Muscat via Omani intermediaries. The US proposed a limited nuclear freeze: Iran caps enrichment at 60% and suspends 90% enrichment work; US offers temporary sanctions waivers on oil.",
          why: "Iran demanded a full sanctions-for-freeze swap with no enrichment rollback. Talks ended without agreement. Both sides called a second round.",
        },
        {
          year: "April 12, 2025",
          title: "Round 2 — First Direct US-Iran Talks Since 2015",
          status: "failed",
          desc: "Witkoff and Iranian Foreign Minister Abbas Araghchi met directly in Muscat — the first face-to-face US-Iran nuclear talks in a decade. Both sides described the atmosphere as 'serious.' A draft framework was circulated.",
          why: "Iran refused any language restricting its right to enrich uranium. The US walked away from the session. Trump called Iran's position 'not serious.'",
        },
        {
          year: "April 19, 2025",
          title: "Israel Strikes Iran — Air Defenses & IRGC Sites",
          status: "strike",
          desc: "Israel conducted strikes on Iranian S-300 air defense batteries and IRGC missile production facilities in Isfahan and Tehran provinces. Iran launched a retaliatory drone-and-missile barrage; most were intercepted.",
          why: "Iran suspended the Muscat diplomatic channel, calling US neutrality 'fake.' Talks paused for several weeks.",
        },
        {
          year: "May 2025",
          title: "Round 3 — Rome Back-Channel",
          status: "failed",
          desc: "Talks resumed via Italian mediation in Rome. A near-deal emerged: Iran would cap enrichment at 20%, ship excess stockpile to a third country, and allow expanded IAEA monitoring. In return: $10B in unfrozen assets and oil waivers.",
          why: "Trump rejected the deal publicly, saying Iran must have 'zero enrichment.' Iran called the demand a non-starter. The Rome draft collapsed.",
        },
        {
          year: "May 2025",
          title: "Mossad Kills Senior IRGC Nuclear Security Chief",
          status: "strike",
          desc: "Israel's Mossad assassinated a brigadier-general overseeing security at Iran's Fordow and Natanz enrichment facilities. The operation was conducted inside Iran using an Iranian agent network. Iran's nuclear program security apparatus went into lockdown.",
          why: "Iran halted IAEA inspector access for two weeks in response. The killing accelerated Iran's push to move enrichment deeper underground.",
        },
        {
          year: "June 2025",
          title: "Round 4 — Muscat, 'Hours Away' from a Deal",
          status: "failed",
          desc: "The most advanced talks yet. US and Iranian delegations worked through the night in Muscat. Officials on both sides told media a deal was 'hours away.' The framework reportedly included a 10-year enrichment cap at 3.67% (JCPOA levels) with phased sanctions relief.",
          why: "Iran demanded the US guarantee it would not withdraw from the deal again. The US refused to offer binding guarantees. Talks collapsed in the final session.",
        },
        {
          year: "Late 2025 – Early 2026",
          title: "Military Escalation — Talks on Ice",
          status: "failed",
          desc: "Following the June collapse, Iran accelerated enrichment toward weapons-grade (90%). The US deployed additional carrier groups to the Gulf. Multiple rounds of indirect contacts via Oman failed to restart negotiations.",
          why: "Iran's nuclear advances and US military posture created a standoff. Both sides signaled openness to talks but set incompatible preconditions.",
        },
        {
          year: "Spring 2026",
          title: "Round 5 — Renewed Oman Channel",
          status: "ongoing",
          desc: "Talks resumed in Muscat with a new US proposal: Iran keeps limited enrichment (5%) for civilian use, dismantles advanced centrifuges, allows daily IAEA inspections. In return: phased sanctions relief over 18 months and security assurances.",
          why: "Negotiations active as of June 2026. Both sides describe the talks as 'the most substantive yet.' No deal signed.",
        },
      ];

      function render(filter) {
        const tl = document.getElementById("timeline");
        tl.innerHTML = "";

        let total = 0,
          deals = 0,
          failed = 0,
          ongoing = 0;

        events.forEach((ev) => {
          if (ev.status !== "strike") total++;
          if (ev.status === "deal") deals++;
          else if (ev.status === "failed") failed++;
          else if (ev.status === "ongoing") ongoing++;

          const show = filter === "all" || filter === ev.status;

          const labels = {
            deal: "Deal Reached",
            failed: "Fell Through",
            partial: "Partial",
            ongoing: "Ongoing",
            strike: "Assassination / Strike",
          };

          const div = document.createElement("div");
          div.className = "event" + (show ? "" : " hidden");
          div.innerHTML = `
      <div class="event-date">${ev.year}</div>
      <div class="dot-wrap"><div class="dot ${ev.status}"></div></div>
      <div class="card">
        <div class="card-top">
          <div class="card-title" data-date="${ev.year}">${ev.title}</div>
          <span class="badge ${ev.status}">${labels[ev.status]}</span>
        </div>
        <div class="card-desc">${ev.desc}</div>
        <div class="card-why">${ev.why}</div>
      </div>
    `;
          tl.appendChild(div);
        });

        document.getElementById("cnt-total").textContent = total;
        document.getElementById("cnt-deals").textContent = deals;
        document.getElementById("cnt-failed").textContent = failed;
        document.getElementById("cnt-ongoing").textContent = ongoing;
      }

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          render(btn.dataset.filter);
        });
      });

      render("all");
    </script>
  </body>
</html>
