<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>US-Iran Deal Counter</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --border: #2a2a3a;
        --text: #e8e8f0;
        --muted: #7a7a9a;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #eab308;
        --blue: #3b82f6;
        --accent: #6366f1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
      }

      header {
        border-bottom: 1px solid var(--border);
        padding: 2.5rem 1rem 2rem;
        text-align: center;
      }

      header h1 {
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }

      header p {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 520px;
        margin: 0 auto;
        line-height: 1.5;
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        padding: 2rem 1rem;
        max-width: 900px;
        margin: 0 auto;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.4rem 2rem;
        text-align: center;
        min-width: 140px;
        flex: 1;
        max-width: 200px;
      }

      .stat-card .number {
        font-size: 2.8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 0.4rem;
      }

      .stat-card .label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .stat-card.total .number {
        color: var(--accent);
      }
      .stat-card.deals .number {
        color: var(--green);
      }
      .stat-card.failed .number {
        color: var(--red);
      }
      .stat-card.ongoing .number {
        color: var(--yellow);
      }

      .filters {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0 1rem 1.5rem;
      }

      .filter-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.4rem 0.9rem;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.15s;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .timeline {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 1rem 4rem;
        position: relative;
      }

      .timeline::before {
        content: "";
        position: absolute;
        left: calc(1rem + 20px);
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }

      .event {
        display: flex;
        gap: 1.2rem;
        margin-bottom: 1.5rem;
        position: relative;
        transition: opacity 0.2s;
      }

      .event.hidden {
        display: none;
      }

      .dot-wrap {
        flex-shrink: 0;
        width: 42px;
        display: flex;
        justify-content: center;
        padding-top: 0.9rem;
        position: relative;
        z-index: 1;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--bg);
      }

      .dot.deal {
        background: var(--green);
      }
      .dot.failed {
        background: var(--red);
      }
      .dot.ongoing {
        background: var(--yellow);
      }
      .dot.partial {
        background: var(--blue);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.1rem 1.3rem;
        flex: 1;
      }

      .card:hover {
        border-color: #3a3a5a;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .card-title {
        font-size: 0.97rem;
        font-weight: 600;
        line-height: 1.3;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .badge.deal {
        background: #16532920;
        color: var(--green);
        border: 1px solid #16532940;
      }
      .badge.failed {
        background: #7f1d1d20;
        color: var(--red);
        border: 1px solid #7f1d1d40;
      }
      .badge.ongoing {
        background: #71350020;
        color: var(--yellow);
        border: 1px solid #71350040;
      }
      .badge.partial {
        background: #1e3a5f20;
        color: var(--blue);
        border: 1px solid #1e3a5f40;
      }

      .card-year {
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 0.45rem;
      }

      .card-desc {
        font-size: 0.855rem;
        color: #b0b0cc;
        line-height: 1.55;
      }

      .card-why {
        margin-top: 0.6rem;
        font-size: 0.8rem;
        color: var(--muted);
        font-style: italic;
      }

      @media (max-width: 480px) {
        .timeline::before {
          left: calc(1rem + 16px);
        }
        .dot-wrap {
          width: 34px;
        }
        .stat-card {
          min-width: 110px;
          padding: 1rem 1.2rem;
        }
        .stat-card .number {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🇺🇸 vs 🇮🇷 &nbsp; Deal Counter</h1>
      <p>
        A timeline of every significant moment the United States and Iran were
        close to a nuclear or diplomatic agreement — and what happened next.
      </p>
    </header>

    <div class="stats">
      <div class="stat-card total">
        <div class="number" id="cnt-total">0</div>
        <div class="label">Close Calls</div>
      </div>
      <div class="stat-card deals">
        <div class="number" id="cnt-deals">0</div>
        <div class="label">Deals Reached</div>
      </div>
      <div class="stat-card failed">
        <div class="number" id="cnt-failed">0</div>
        <div class="label">Fell Through</div>
      </div>
      <div class="stat-card ongoing">
        <div class="number" id="cnt-ongoing">0</div>
        <div class="label">Ongoing / Open</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="deal">Deals Reached</button>
      <button class="filter-btn" data-filter="failed">Fell Through</button>
      <button class="filter-btn" data-filter="partial">Partial</button>
      <button class="filter-btn" data-filter="ongoing">Ongoing</button>
    </div>

    <div class="timeline" id="timeline"></div>

    <script>
      const events = [
        {
          year: "2003",
          title: "Iran's 'Grand Bargain' Proposal",
          status: "failed",
          desc: "Following the Iraq invasion, Iran sent a sweeping proposal via the Swiss embassy offering to discuss its nuclear program, support for Hezbollah, and recognition of Israel — in exchange for security guarantees and normalized relations.",
          why: "The Bush administration refused to engage, reportedly dismissing it without review.",
        },
        {
          year: "2003–2004",
          title: "EU-3 Tehran Agreement",
          status: "partial",
          desc: "Iran signed the Additional Protocol and agreed to suspend uranium enrichment in talks with France, Germany, and the UK (with tacit US involvement). The first formal suspension since Iran's nuclear program began.",
          why: "Iran resumed enrichment in 2005 after EU talks stalled over security guarantees.",
        },
        {
          year: "2006–2008",
          title: "P5+1 Incentives Package",
          status: "failed",
          desc: "The US joined the P5+1 group offering Iran a package of economic incentives to halt enrichment. The US agreed for the first time to participate in direct talks if Iran suspended first.",
          why: "Iran rejected preconditions; talks never meaningfully began.",
        },
        {
          year: "2009",
          title: "Obama's Dual-Track Outreach",
          status: "failed",
          desc: "President Obama sent direct letters to Supreme Leader Khamenei and extended an open hand to Iran. The Geneva talks produced a brief framework (the Tehran Research Reactor deal) that fell apart within weeks.",
          why: "Iran's disputed 2009 election and internal politics caused the proposal to collapse.",
        },
        {
          year: "2012",
          title: "Baghdad & Moscow Rounds",
          status: "failed",
          desc: "Multiple rounds of P5+1 talks in Istanbul, Baghdad, and Moscow. Negotiators came close on a limited agreement to cap 20% enrichment in exchange for partial sanctions relief.",
          why: "Wide gaps on sanctions and the scope of Iran's enrichment rights caused a breakdown.",
        },
        {
          year: "2013",
          title: "Joint Plan of Action (Geneva)",
          status: "deal",
          desc: "Iran and P5+1 reached the first binding interim agreement: Iran capped enrichment at 5%, diluted its 20% stockpile, and halted construction at Arak. In return, ~$7B in limited sanctions relief.",
          why: "First successful deal in decades. Served as a bridge to full JCPOA negotiations.",
        },
        {
          year: "2014",
          title: "JCPOA Extension — Near Miss",
          status: "failed",
          desc: "Negotiations for a comprehensive deal nearly concluded in November 2014 but missed the deadline. A 7-month extension was granted as talks were 'very close' on key technical issues.",
          why: "Disputes over the number of centrifuges and pace of sanctions relief caused the delay.",
        },
        {
          year: "2015",
          title: "JCPOA Signed",
          status: "deal",
          desc: "The Joint Comprehensive Plan of Action was finalized in Vienna. Iran agreed to dramatic reductions in its nuclear program for 10–15 years in exchange for sweeping sanctions relief. Widely considered the most comprehensive nonproliferation deal in history.",
          why: "Deal held — until US withdrawal in 2018.",
        },
        {
          year: "2018",
          title: "Trump Withdraws from JCPOA",
          status: "failed",
          desc: "President Trump withdrew the US from the JCPOA and reimposed 'maximum pressure' sanctions. Iran remained in the deal for one year, then began systematically exceeding its limits.",
          why: "No alternative deal was ever offered. Iran's nuclear program accelerated significantly.",
        },
        {
          year: "2019–2020",
          title: "Secret Back-Channel Talks",
          status: "failed",
          desc: "Oman and Japan facilitated back-channel contacts between US and Iranian officials. Multiple reports of near-meetings between Trump and Rouhani at the UN General Assembly.",
          why: "Killing of Gen. Soleimani in January 2020 ended any diplomatic opening.",
        },
        {
          year: "2021–2022",
          title: "Vienna JCPOA Restoration Talks",
          status: "failed",
          desc: "Biden administration entered indirect talks in Vienna to restore the JCPOA. Eight rounds of talks over 16 months. A final EU-drafted text was on the table in August 2022 with most issues resolved.",
          why: "Iran demanded the IAEA close its probe into undeclared sites — a condition the US could not accept. Talks collapsed.",
        },
        {
          year: "2023",
          title: "Prisoner Swap & Funds Release",
          status: "partial",
          desc: "The US and Iran reached a limited deal: 5 Americans held in Iran were released in exchange for 5 Iranians held in the US, and $6B in frozen Iranian oil funds were released from South Korean accounts.",
          why: "Not a nuclear deal — but the first major bilateral agreement since 2018 and a rare sign of functional diplomacy.",
        },
        {
          year: "2025",
          title: "Trump-Era Oman Channel",
          status: "ongoing",
          desc: "The Trump administration initiated indirect talks via Omani intermediaries, with reported direct US-Iranian contact. Multiple rounds held in Muscat through early 2026, focused on a limited nuclear freeze deal.",
          why: "Status: active negotiations. No agreement yet, but described by both sides as 'serious.'",
        },
      ];

      function render(filter) {
        const tl = document.getElementById("timeline");
        tl.innerHTML = "";

        let total = 0,
          deals = 0,
          failed = 0,
          ongoing = 0;

        events.forEach((ev) => {
          total++;
          if (ev.status === "deal") deals++;
          else if (ev.status === "failed") failed++;
          else if (ev.status === "ongoing") ongoing++;

          const show = filter === "all" || filter === ev.status;

          const labels = {
            deal: "Deal Reached",
            failed: "Fell Through",
            partial: "Partial",
            ongoing: "Ongoing",
          };

          const div = document.createElement("div");
          div.className = "event" + (show ? "" : " hidden");
          div.innerHTML = `
      <div class="dot-wrap"><div class="dot ${ev.status}"></div></div>
      <div class="card">
        <div class="card-top">
          <div class="card-title">${ev.title}</div>
          <span class="badge ${ev.status}">${labels[ev.status]}</span>
        </div>
        <div class="card-year">${ev.year}</div>
        <div class="card-desc">${ev.desc}</div>
        <div class="card-why">${ev.why}</div>
      </div>
    `;
          tl.appendChild(div);
        });

        document.getElementById("cnt-total").textContent = total;
        document.getElementById("cnt-deals").textContent = deals;
        document.getElementById("cnt-failed").textContent = failed;
        document.getElementById("cnt-ongoing").textContent = ongoing;
      }

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          render(btn.dataset.filter);
        });
      });

      render("all");
    </script>
  </body>
</html>
