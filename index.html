<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trump vs Iran: Deal Counter</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --border: #2a2a3a;
        --text: #e8e8f0;
        --muted: #7a7a9a;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #eab308;
        --blue: #3b82f6;
        --accent: #6366f1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
      }

      header {
        border-bottom: 1px solid var(--border);
        padding: 2.5rem 1rem 2rem;
        text-align: center;
      }

      header h1 {
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }

      header p {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 520px;
        margin: 0 auto;
        line-height: 1.5;
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        padding: 2rem 1rem;
        max-width: 900px;
        margin: 0 auto;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.4rem 2rem;
        text-align: center;
        min-width: 140px;
        flex: 1;
        max-width: 200px;
      }

      .stat-card .number {
        font-size: 2.8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 0.4rem;
      }

      .stat-card .label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .stat-card.total .number {
        color: var(--accent);
      }
      .stat-card.deals .number {
        color: var(--green);
      }
      .stat-card.failed .number {
        color: var(--red);
      }
      .stat-card.ongoing .number {
        color: var(--yellow);
      }

      .filters {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0 1rem 1.5rem;
      }

      .filter-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.4rem 0.9rem;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.15s;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .timeline {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 1rem 4rem;
        position: relative;
      }

      .timeline::before {
        content: "";
        position: absolute;
        left: calc(1rem + 20px);
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }

      .event {
        display: flex;
        gap: 1.2rem;
        margin-bottom: 1.5rem;
        position: relative;
        transition: opacity 0.2s;
      }

      .event.hidden {
        display: none;
      }

      .dot-wrap {
        flex-shrink: 0;
        width: 42px;
        display: flex;
        justify-content: center;
        padding-top: 0.9rem;
        position: relative;
        z-index: 1;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--bg);
      }

      .dot.deal {
        background: var(--green);
      }
      .dot.failed {
        background: var(--red);
      }
      .dot.ongoing {
        background: var(--yellow);
      }
      .dot.partial {
        background: var(--blue);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.1rem 1.3rem;
        flex: 1;
      }

      .card:hover {
        border-color: #3a3a5a;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .card-title {
        font-size: 0.97rem;
        font-weight: 600;
        line-height: 1.3;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .badge.deal {
        background: #16532920;
        color: var(--green);
        border: 1px solid #16532940;
      }
      .badge.failed {
        background: #7f1d1d20;
        color: var(--red);
        border: 1px solid #7f1d1d40;
      }
      .badge.ongoing {
        background: #71350020;
        color: var(--yellow);
        border: 1px solid #71350040;
      }
      .badge.partial {
        background: #1e3a5f20;
        color: var(--blue);
        border: 1px solid #1e3a5f40;
      }

      .card-year {
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 0.45rem;
      }

      .card-desc {
        font-size: 0.855rem;
        color: #b0b0cc;
        line-height: 1.55;
      }

      .card-why {
        margin-top: 0.6rem;
        font-size: 0.8rem;
        color: var(--muted);
        font-style: italic;
      }

      @media (max-width: 480px) {
        .timeline::before {
          left: calc(1rem + 16px);
        }
        .dot-wrap {
          width: 34px;
        }
        .stat-card {
          min-width: 110px;
          padding: 1rem 1.2rem;
        }
        .stat-card .number {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Trump vs Iran &nbsp; Deal Counter</h1>
      <p>
        Every time Trump was close to a deal with Iran — and why it didn't
        happen. Covering both terms: 2017&ndash;2021 and 2025&ndash;present.
      </p>
    </header>

    <div class="stats">
      <div class="stat-card total">
        <div class="number" id="cnt-total">0</div>
        <div class="label">Close Calls</div>
      </div>
      <div class="stat-card deals">
        <div class="number" id="cnt-deals">0</div>
        <div class="label">Deals Signed</div>
      </div>
      <div class="stat-card failed">
        <div class="number" id="cnt-failed">0</div>
        <div class="label">Fell Through</div>
      </div>
      <div class="stat-card ongoing">
        <div class="number" id="cnt-ongoing">0</div>
        <div class="label">Ongoing / Open</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="failed">Fell Through</button>
      <button class="filter-btn" data-filter="ongoing">Ongoing</button>
    </div>

    <div class="timeline" id="timeline"></div>

    <script>
      const events = [
        {
          year: "May 2018",
          title: "Trump Withdraws from JCPOA",
          status: "failed",
          desc: "Trump pulled the US out of the 2015 nuclear deal and relaunched 'maximum pressure' sanctions, promising to negotiate a 'better deal' that would cover missiles, regional proxies, and a permanent end to enrichment.",
          why: "No alternative framework was ever put on the table. Iran accelerated its nuclear program in response.",
        },
        {
          year: "June 2019",
          title: "'No Preconditions' Meeting Offer",
          status: "failed",
          desc: "Trump repeatedly offered to meet Iranian President Rouhani with 'no preconditions' — at the G20, in New York, and publicly via Twitter. He said he was willing to talk 'anytime they want.'",
          why: "Iran rejected the offer while US sanctions remained in place. Rouhani called it 'psychological warfare.'",
        },
        {
          year: "August 2019",
          title: "Macron's G7 Back-Channel — Zarif Visit",
          status: "failed",
          desc: "French President Macron brought Iranian FM Javad Zarif to the G7 in Biarritz as a surprise guest and shuttled between Trump and Zarif trying to arrange a direct meeting. Trump said he was open to it.",
          why: "Iran demanded sanctions be lifted first. No meeting happened. Trump later said Macron 'didn't have my approval.'",
        },
        {
          year: "September 2019",
          title: "UN General Assembly Near-Meeting",
          status: "failed",
          desc: "Trump and Rouhani were both at the UN in New York. Multiple officials described a potential meeting as 'very close.' Macron again mediated. Trump said he would meet 'under the right circumstances.'",
          why: "Iran said it would only talk after sanctions relief. Bolton's firing days earlier added uncertainty. No meeting.",
        },
        {
          year: "October 2019",
          title: "Japan-Mediated Back-Channel",
          status: "failed",
          desc: "PM Shinzo Abe visited Tehran and Washington to carry messages between Trump and Khamenei. Abe delivered a personal letter from Trump to Khamenei proposing direct talks.",
          why: "Khamenei publicly rejected the outreach, saying Iran had 'no trust' in Trump after the JCPOA withdrawal.",
        },
        {
          year: "January 2020",
          title: "Soleimani Killing — Diplomacy Ends",
          status: "failed",
          desc: "The US killed IRGC General Qasem Soleimani in a drone strike in Baghdad. Iran launched ballistic missiles at US bases in Iraq. Any remaining diplomatic track was immediately closed.",
          why: "Both sides pulled back from direct conflict, but the killing ended any prospect of talks for the rest of Term 1.",
        },
        {
          year: "March 2025",
          title: "Oman Channel Opens — Term 2",
          status: "ongoing",
          desc: "Trump sent envoy Steve Witkoff to Oman for indirect talks with Iranian officials. Trump simultaneously threatened military action if Iran didn't negotiate, calling it a 'once-in-a-lifetime' opportunity for a deal.",
          why: "First formal US-Iran diplomatic contact of Trump's second term. Ongoing.",
        },
        {
          year: "April 2025",
          title: "First Direct US-Iran Talks Since 2015",
          status: "ongoing",
          desc: "In an unprecedented move for a Trump administration, US and Iranian negotiators held direct face-to-face talks in Muscat, Oman. Described by both sides as 'constructive.' Witkoff led for the US; Iran sent senior nuclear negotiators.",
          why: "No agreement reached. A second round was scheduled. Trump said a deal was 'possible.'",
        },
        {
          year: "May–June 2025",
          status: "ongoing",
          title: "Multiple Rounds in Muscat",
          desc: "Three additional rounds of direct and indirect talks held in Muscat and Rome. Discussions focused on a limited nuclear freeze: Iran caps enrichment at 60%, agrees to IAEA access; US provides partial sanctions relief.",
          why: "Sticking points: Iran insists on keeping enrichment infrastructure; US wants zero enrichment on Iranian soil. No deal as of June 2026.",
        },
      ];

      function render(filter) {
        const tl = document.getElementById("timeline");
        tl.innerHTML = "";

        let total = 0,
          deals = 0,
          failed = 0,
          ongoing = 0;

        events.forEach((ev) => {
          total++;
          if (ev.status === "deal") deals++;
          else if (ev.status === "failed") failed++;
          else if (ev.status === "ongoing") ongoing++;

          const show = filter === "all" || filter === ev.status;

          const labels = {
            deal: "Deal Reached",
            failed: "Fell Through",
            partial: "Partial",
            ongoing: "Ongoing",
          };

          const div = document.createElement("div");
          div.className = "event" + (show ? "" : " hidden");
          div.innerHTML = `
      <div class="dot-wrap"><div class="dot ${ev.status}"></div></div>
      <div class="card">
        <div class="card-top">
          <div class="card-title">${ev.title}</div>
          <span class="badge ${ev.status}">${labels[ev.status]}</span>
        </div>
        <div class="card-year">${ev.year}</div>
        <div class="card-desc">${ev.desc}</div>
        <div class="card-why">${ev.why}</div>
      </div>
    `;
          tl.appendChild(div);
        });

        document.getElementById("cnt-total").textContent = total;
        document.getElementById("cnt-deals").textContent = deals;
        document.getElementById("cnt-failed").textContent = failed;
        document.getElementById("cnt-ongoing").textContent = ongoing;
      }

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          render(btn.dataset.filter);
        });
      });

      render("all");
    </script>
  </body>
</html>
